user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Recordings can be hundreds of MB
    client_max_body_size 512m;

    # Internal service ports (loopback only)
    # web  = Next.js standalone server :3000
    # api  = Express convert API       :3001
    upstream web {
        server 127.0.0.1:3000;
    }
    upstream api {
        server 127.0.0.1:3001;
    }

    server {
        listen 80;
        server_name _;

        # --- API: protected by HTTP Basic Auth ---------------------------
        # This is the container-level layer of defense. The outer Apache
        # vhost enforces the same Basic Auth; here it guarantees FFmpeg is
        # never reachable unauthenticated regardless of proxy setup.
        location /api/ {
            auth_basic "Screen Recorder API";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream uploads straight through; conversions can be slow
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # --- Frontend ----------------------------------------------------
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
